packages:
  - apps/*
  - packages/*
  # Temporary: the iPhone trial (spikes/capacitor-trial/PLAN.md) depends on the workspace packages.
  - spikes/capacitor-trial
minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.133.0'

# Reviewed install scripts: none is needed (a no-op preinstall, a CLI compatibility check, and
# esbuild's binary check; its platform binary comes as an optional dependency).
allowBuilds:
  '@google/genai': false
  protobufjs: false
  esbuild: false
